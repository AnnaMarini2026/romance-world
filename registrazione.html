
<html>
<head>
    <title>Romance World - Account</title>
    <link rel="stylesheet" href="stile.css">
</head>

<body>

<center>

    <h1>♡ Romance World ♡</h1>

    <h2>Crea il tuo account</h2>

    <div class="card">

        <input id="username" placeholder="Scegli uno username">

        <br>

        <input id="email" type="email" placeholder="La tua email">

        <br>

        <input id="password" type="password" placeholder="Crea una password">

        <br>

        <input id="eta" type="number" placeholder="Quanti anni hai?">

        <br>

        <button type="button" onclick="registrati()">
    Registrati 💗
</button>

    </div>

    <h2>Hai già un account?</h2>

    <div class="card">

        <input id="emailLogin" type="email" placeholder="La tua email">

        <br>

        <input id="passwordLogin" type="password" placeholder="La tua password">

        <br>

        <button onclick="accedi()">
            Accedi
        </button>

    </div>

    <p id="messaggio"></p>

    <hr color="pink">

    <a href="index.html">Torna alla Home</a>

    <br><br>

    <a href="libreria.html">Scopri i libri 📚</a>

</center>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>


async function registrati() {

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const eta = Number(document.getElementById("eta").value);

    const messaggio = document.getElementById("messaggio");

    if (!username || !email || !password || !eta) {
        messaggio.innerHTML = "Compila tutti i campi! 💗";
        return;
    }

    if (password.length < 8) {
        messaggio.innerHTML = "La password deve avere almeno 8 caratteri.";
        return;
    }

    if (eta < 10 || eta > 120) {
        messaggio.innerHTML = "Inserisci un'età valida.";
        return;
    }

    messaggio.innerHTML = "Registrazione in corso... 💗";

    try {

        const { data, error } = await db.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    username: username,
                    age: eta
                }
            }
        });

        if (error) {
            throw error;
        }

        if (data.user) {
            messaggio.innerHTML =
                "Account creato! 💕 Controlla la tua email per confermare la registrazione.";
        }

    } catch (errore) {

        messaggio.innerHTML = "Errore: " + errore.message;
        console.error(errore);

    }
}

async function accedi() {

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let messaggio = document.getElementById("messaggio");

    messaggio.innerHTML = "Accesso in corso... 💗";

    try {

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        messaggio.innerHTML = "Accesso effettuato! 💕";

        window.location.href = "profilo.html";

    } catch (errore) {

        messaggio.innerHTML = "Errore: " + errore.message;

    }

}

</script>

</body>
</html>
