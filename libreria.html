// ========================================
// IMMAGINE SOSTITUTIVA
// ========================================

const copertinaVuota =
    "https://placehold.co/150x220/FFF0F5/C71585?text=Romance+World";


// ========================================
// PROTEZIONE DEI TESTI
// ========================================

function sicuro(testo) {

    let risultato = String(testo);

    risultato = risultato.replace(/&/g, "&amp;");
    risultato = risultato.replace(/</g, "&lt;");
    risultato = risultato.replace(/>/g, "&gt;");
    risultato = risultato.replace(/"/g, "&quot;");
    risultato = risultato.replace(/'/g, "&#39;");

    return risultato;

}


// ========================================
// MOSTRA I LIBRI
// ========================================


// ========================================
// FILTRO DELLE CATEGORIE
// ========================================

function filtraCategoria(categoria) {

    let risultati;

    if (categoria === "Tutti") {

        risultati = libri;

    } else {

        risultati = libri.filter(function(libro) {

            return libro.categoria === categoria;

        });

    }

    mostraLibri(risultati);

    document.getElementById("titoloDettaglio").textContent = "";

    document.getElementById("dettaglio").textContent =
        "Clicca sulla copertina di un libro per scoprirne la trama! 💕";

}

function mostraLibri(elenco) {

    let catalogo = document.getElementById("catalogo");

    catalogo.innerHTML = "";

    if (elenco.length === 0) {
        catalogo.textContent =
            "Non ci sono ancora libri in questa categoria. 💗";
        return;
    }

    elenco.forEach(function(libro) {

        let indice = libri.indexOf(libro);

        let card = document.createElement("div");

        card.className = "card";

        card.style.display = "inline-block";
        card.style.width = "180px";
        card.style.verticalAlign = "top";

        let immagine = document.createElement("img");

        immagine.id = "copertina-" + indice;

        // USA DIRETTAMENTE IL LINK INSERITO NEL LIBRO
        immagine.src = libro.copertina || copertinaVuota;

        immagine.width = 130;
        immagine.height = 190;
        immagine.style.objectFit = "contain";

        immagine.alt = "Copertina di " + libro.titolo;

        immagine.onerror = function() {
            this.onerror = null;
            this.src = copertinaVuota;
        };

        immagine.style.cursor = "pointer";

        immagine.onclick = function() {
            mostraDettaglio(indice);
        };

        let titolo = document.createElement("h3");
        titolo.textContent = libro.titolo;

        let autore = document.createElement("p");
        autore.textContent = libro.autore;

        let pulsante = document.createElement("button");

        pulsante.textContent = "Scopri il libro 💗";

        pulsante.onclick = function() {
            mostraDettaglio(indice);
        };

        card.appendChild(immagine);
        card.appendChild(titolo);
        card.appendChild(autore);
        card.appendChild(pulsante);

        catalogo.appendChild(card);

    });

}



// ========================================
// DETTAGLIO DEL LIBRO
// ========================================

function mostraDettaglio(indice) {

    let libro = libri[indice];

    if (!libro) return;

    document.getElementById("titoloDettaglio").textContent =
        libro.titolo;

    document.getElementById("dettaglio").innerHTML = `

        <img src="${sicuro(libro.copertina || copertinaVuota)}"
             width="150"
             alt="Copertina del libro"
             onerror="this.onerror=null; this.src='${copertinaVuota}';">

        <h2>${sicuro(libro.titolo)}</h2>

        <p>
            <b>Autrice:</b>
            ${sicuro(libro.autore)}
        </p>

        <p>
            <b>Età consigliata:</b>
            ${libro.eta}+ anni
        </p>

        <p>
            <b>Genere:</b>
            ${sicuro(libro.genere)}
        </p>

        <p>
            <b>Categoria:</b>
            ${sicuro(libro.categoria)}
        </p>

        <h3>Trama</h3>

        <p>${sicuro(libro.trama)}</p>

        <a href="profilo.html?libro=${encodeURIComponent(libro.titolo)}">

            <button>
                Aggiungi alla mia libreria 💗
            </button>

        </a>

    `;

    document.getElementById("dettaglio").scrollIntoView({

        behavior: "smooth",

        block: "start"

    });

}


// ========================================
// AVVIO DEL CATALOGO
// ========================================

function avviaCatalogo() {

    mostraLibri(libri);

    

}

avviaCatalogo();
